name: Fork CI bridge probe
permissions:
  actions: read
  checks: write
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event || 'update' }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
jobs:
  bridge:
    if: github.repository == 'sdf-jkl/arrow-rs' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_branch == 'codex/fork-ci-e2e'))
    name: Mirror the fork run
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
    - name: Record native event and hold for overlap test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        PROBE_GROUP: ${{ github.workflow }}-${{ github.event.workflow_run.event || 'update' }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      with:
        script: "const run = context.payload.workflow_run;\ncore.info(JSON.stringify({event: context.eventName, group: process.env.PROBE_GROUP,\n  source_run: run?.id, attempt: run?.run_attempt, source_event: run?.event,\n  branch: run?.head_branch, sha: run?.head_sha, repository: run?.head_repository?.full_name,\n  pull_requests: run?.pull_requests?.map(pr => pr.number)}));\nconst hold = context.eventName === 'workflow_run'\n  ? (run.run_attempt <= 2 ? 120 : 5)\n  : Math.min(120, Math.max(0, Number(context.payload.inputs?.hold_seconds) || 0));\ncore.info('Probe hold: ' + hold + ' seconds');\nawait new Promise(resolve => setTimeout(resolve, hold * 1000));"
    - name: Create or update the check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "// Adapted from apache/datafusion#25591. Fork results are informational:\n// contributors control their workflows; only upstream merge-queue CI gates merging.\nconst CHECK = 'CI (fork probe)';\nconst WORKFLOW = 'ci.yml';\nconst upstream = { owner: context.repo.owner, repo: context.repo.repo };\nconst repository = 'apache/arrow-rs';\nconst GUIDE = 'https://github.com/apache/arrow-rs/blob/main/CONTRIBUTING.md#pull-requests-from-forks';\nconst SWEEP_SIZE = 25;\nconst listing = { ...upstream, head: 'sdf-jkl:codex/fork-ci-e2e', state: 'open', base: 'main', sort: 'updated', direction: 'desc' };\nconst isForkPr = (pr) => pr.state === 'open' && pr.head.repo &&\n  pr.head.repo.full_name.toLowerCase() !== repository.toLowerCase() && pr.base.ref === 'main';\nconst externalId = (pr) => 'arrow-rs-fork-ci:' + pr.number;\nconst conclusions = new Set([\n  'action_required', 'cancelled', 'failure', 'neutral', 'skipped', 'success', 'timed_out',\n]);\nconst UPDATE_NOTE =\n  'This check is\
          \ informational: the contributor controls the fork workflow. ' +\n  'The upstream merge queue runs the required CI checks on the proposed merge result. ' +\n  'Active or missing runs on recently updated PRs are polled every 15 minutes; ' +\n  'a rotating sweep also discovers reruns on older PRs. Scheduled updates may be delayed.';\n\n// An absent workflow/run is expected on a fork with Actions disabled. Other\n// API errors must fail the bridge rather than falsely reporting missing CI.\nasync function optional(request) {\n  try {\n    return (await request()).data;\n  } catch (error) {\n    if (error.status === 404) return null;\n    throw error;\n  }\n}\n\nasync function syncCheck(pr, includeCompleted = true) {\n  if (!isForkPr(pr)) return;\n  const fork = { owner: pr.head.repo.owner.login, repo: pr.head.repo.name };\n  const sha = pr.head.sha;\n  const checks = await github.paginate(github.rest.checks.listForRef, {\n    ...upstream, ref: sha, check_name: CHECK, per_page: 100,\n\
          \  });\n  const check = checks.find((item) =>\n    item.app?.slug === 'github-actions' && item.external_id === externalId(pr));\n  let previous = {};\n  try { previous = JSON.parse(check?.output?.text || '{}'); } catch {}\n  // A missing run must keep being polled, even though its check is completed.\n  if (!includeCompleted && check?.status === 'completed' && previous.run_id) return;\n\n  const data = await optional(() => github.rest.actions.listWorkflowRuns({\n    ...fork, workflow_id: WORKFLOW, head_sha: sha, branch: pr.head.ref, per_page: 100,\n  }));\n  // Ignore PR merge-ref runs. The named CI workflow on push/manual\n  // events tests the branch head; contributors still control its code.\n  const run = (data?.workflow_runs || []).filter((item) =>\n    item.head_sha === sha && item.head_branch === pr.head.ref &&\n    ['push', 'workflow_dispatch'].includes(item.event)\n  ).sort((a, b) => b.id - a.id)[0];\n  let payload;\n  if (run) {\n    const status = run.status === 'completed'\
          \ ? 'completed' :\n      run.status === 'in_progress' ? 'in_progress' : 'queued';\n    payload = {\n      status,\n      ...(status === 'completed' ? {\n        conclusion: conclusions.has(run.conclusion) ? run.conclusion : 'failure',\n      } : {}),\n      details_url: run.html_url,\n      output: {\n        title: 'Fork CI: ' + (status === 'completed' ? run.conclusion : status),\n        summary: [\n          '[CI run on ' + pr.head.repo.full_name + '](' + run.html_url + ') for ' + sha + '.',\n          'Rerun failed checks in the fork. A green fork run tests the branch head, not its merge with main.',\n          UPDATE_NOTE,\n        ].join('\\n\\n'),\n        text: JSON.stringify({ head_sha: sha, run_id: run.id, run_attempt: run.run_attempt }),\n      },\n    };\n  } else {\n    const workflow = await optional(() => github.rest.actions.getWorkflow({\n      ...fork, workflow_id: WORKFLOW,\n    }));\n    const disabled = !workflow || workflow.state.startsWith('disabled');\n \
          \   payload = {\n      status: 'completed',\n      conclusion: disabled ? 'action_required' : 'neutral',\n      details_url: 'https://github.com/' + pr.head.repo.full_name + '/actions',\n      output: {\n        title: disabled ? 'Enable CI on your fork' : 'No fork CI run for this commit',\n        summary: [\n          'No CI run was found for ' + sha + ' on ' + pr.head.repo.full_name + '.',\n          'Enable workflows in the fork\u2019s Actions tab, sync/rebase to include the fork CI workflow, ' +\n          'then push your branch or manually run CI on that branch. A newly pushed run may take a moment to appear.',\n          UPDATE_NOTE,\n          '[Fork CI setup](' + GUIDE + ')',\n        ].join('\\n\\n'),\n        text: JSON.stringify({ head_sha: sha, run_id: null }),\n      },\n    };\n  }\n  if (check && check.status === payload.status &&\n      check.conclusion === (payload.conclusion || null) &&\n      check.output?.text === payload.output.text &&\n      check.output?.summary\
          \ === payload.output.summary) return;\n  if (check) {\n    await github.rest.checks.update({ ...upstream, check_run_id: check.id, ...payload });\n  } else {\n    await github.rest.checks.create({\n      ...upstream, name: CHECK, head_sha: sha, external_id: externalId(pr), ...payload,\n    });\n  }\n  core.info('#' + pr.number + ': ' + (payload.conclusion || payload.status));\n}\n\nasync function notify() {\n  const run = context.payload.workflow_run;\n  if (run.event !== 'pull_request' || !run.head_repository ||\n      run.head_repository.full_name.toLowerCase() === repository.toLowerCase()) return;\n  // GitHub can leave workflow_run.pull_requests empty for fork PRs. Resolve\n  // from the API instead, and recheck the current head to ignore stale runs.\n  const prs = await github.paginate(github.rest.pulls.list, {\n    ...listing, head: run.head_repository.owner.login + ':' + run.head_branch, per_page: 100,\n  });\n  for (const pr of prs) {\n    if (pr.head.sha === run.head_sha\
          \ &&\n        pr.head.repo?.full_name.toLowerCase() === run.head_repository.full_name.toLowerCase()) {\n      await syncCheck(pr);\n    }\n  }\n}\n\nasync function update() {\n  const errors = [];\n  // A failed update must not prevent unrelated PRs from being refreshed.\n  async function syncPr(pr, includeCompleted) {\n    try {\n      await syncCheck(pr, includeCompleted);\n    } catch (error) {\n      errors.push('#' + pr.number + ': ' + error.message);\n    }\n  }\n  const count = await github.rest.pulls.list({ ...listing, per_page: 1 });\n  const last = /[?&]page=(\\d+)>;\\s*rel=\"last\"/.exec(count.headers.link || '');\n  const total = last ? Number(last[1]) : count.data.length;\n  if (!total) return;\n  const slices = Math.ceil(total / SWEEP_SIZE);\n  const slot = Math.floor(Date.now() / (15 * 60 * 1000));\n  const { data: slice } = await github.rest.pulls.list({\n    ...listing, per_page: SWEEP_SIZE, page: (slot % slices) + 1,\n  });\n  const sweepNumbers = new Set(slice.map((pr)\
          \ => pr.number));\n  const seen = new Set();\n  const cutoff = Date.now() - 6 * 3600 * 1000;\n  // Poll active and missing checks on recently updated PRs, and completed\n  // checks only in the rotating slice. This bounds expensive fork API calls.\n  const pages = github.paginate.iterator(github.rest.pulls.list, { ...listing, per_page: 100 });\n  for await (const page of pages) {\n    let stale = false;\n    for (const pr of page.data) {\n      if (new Date(pr.updated_at).getTime() < cutoff) { stale = true; break; }\n      seen.add(pr.number);\n      await syncPr(pr, sweepNumbers.has(pr.number));\n    }\n    if (stale) break;\n  }\n  for (const pr of slice) {\n    if (!seen.has(pr.number)) await syncPr(pr);\n  }\n  if (errors.length) core.setFailed(errors.join('\\n'));\n}\n\nif (repository === 'apache/arrow-rs') {\n  if (context.eventName === 'workflow_run') await notify();\n  else await update();\n}\n"
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
  workflow_dispatch:
    inputs:
      hold_seconds:
        type: number
        default: 0
        description: Temporary overlap probe (0 to 120 seconds)
