name: CI
concurrency:
  group: ${{ github.repository }}-${{ github.repository != 'apache/arrow-rs' && github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}-${{ github.event.pull_request.number || (github.repository != 'apache/arrow-rs' && github.ref) || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Select and validate CI suites
    if: github.event_name != 'push' || github.repository != 'apache/arrow-rs' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      cache-refresh-only: ${{ steps.select.outputs.cache-refresh-only }}
      fork-pr: ${{ steps.select.outputs.fork-pr }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install CI configuration dependency
      run: "for attempt in 1 2 3; do\n  python3 -m pip install PyYAML==6.0.3 && break\n  if [ \"$attempt\" -eq 3 ]; then exit 1; fi\n  sleep 5\ndone\n"
    - name: Select suites
      id: select
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PROBE_MODE: ${{ inputs.mode }}
      run: "case \"$PROBE_MODE\" in\n  fork-pr) export GITHUB_EVENT_NAME=pull_request GITHUB_REPOSITORY=apache/arrow-rs PR_HEAD_REPOSITORY=sdf-jkl/arrow-rs PR_BASE_REF=main ;;\n  merge-queue) export GITHUB_EVENT_NAME=merge_group GITHUB_REPOSITORY=apache/arrow-rs ;;\nesac\npython3 .github/ci/scripts/compute-changes.py"
  arrow:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'arrow')
    uses: ./.github/workflows/arrow.yml
  arrow-flight:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'arrow-flight')
    uses: ./.github/workflows/arrow_flight.yml
  parquet:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'parquet')
    uses: ./.github/workflows/parquet.yml
    with:
      cache-refresh-only: ${{ needs.changes.outputs.cache-refresh-only == 'true' }}
  integration:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'integration')
    uses: ./.github/workflows/integration.yml
    with:
      cache-refresh-only: ${{ needs.changes.outputs.cache-refresh-only == 'true' }}
  audit:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'audit')
    uses: ./.github/workflows/audit.yml
  dev:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'dev')
    uses: ./.github/workflows/dev.yml
  rust:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'rust')
    uses: ./.github/workflows/rust.yml
    with:
      lint-only: ${{ needs.changes.outputs.fork-pr == 'true' }}
  docs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'docs')
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
  required-checks:
    name: Required Checks
    if: always() && (github.event_name != 'push' || github.repository != 'apache/arrow-rs' || github.ref == 'refs/heads/main')
    permissions: {}
    needs:
    - changes
    - arrow
    - arrow-flight
    - parquet
    - integration
    - audit
    - dev
    - rust
    - docs
    runs-on: ubuntu-slim
    steps:
    - name: Summarize suite results
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: echo "$NEEDS"
    - name: Link to fork CI
      if: needs.changes.outputs.fork-pr == 'true'
      env:
        FORK_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: "{\n  printf 'Full test results: [CI on %s](https://github.com/%s/actions/workflows/ci.yml).\\n\\n' \"$FORK_REPOSITORY\" \"$FORK_REPOSITORY\"\n  printf 'Look for commit `%s`. Enable Actions in your fork and push your branch if no run exists.\\n\\n' \"$PR_HEAD_SHA\"\n  printf 'This upstream PR run checks formatting and contributor hygiene. The merge queue runs the required CI checks before merge.\\n'\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Fail if any suite failed or was cancelled
      if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: 'echo "::error::One or more CI suites did not succeed. See the results above."

        exit 1

        '
'on':
  push:
    branches:
    - codex/fork-ci-e2e
  pull_request: null
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
        - real
        - fork-pr
        - merge-queue
        default: real
      outcome:
        type: choice
        options:
        - success
        - failure
        default: success
