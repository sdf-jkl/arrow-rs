name: Fork CI cancellation probe
run-name: 'cancel probe: ${{ github.event_name }}'
'on':
  push:
    branches:
    - codex/fork-ci-cancel-probe
  workflow_dispatch:
    inputs:
      seconds:
        type: string
        default: '120'
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.repository != 'apache/arrow-rs' && github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}-${{ github.event.pull_request.number || (github.repository != 'apache/arrow-rs' && github.ref) || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
    - name: Hold the slot
      env:
        SECONDS_TO_WAIT: ${{ inputs.seconds || '5' }}
      run: 'date -u

        sleep "$SECONDS_TO_WAIT"

        date -u'
