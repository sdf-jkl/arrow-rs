name: Fork CI queue probe
run-name: 'queue probe: ${{ inputs.label }}'
'on':
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      seconds:
        type: string
        default: '5'
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  queue: max
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
    - name: Hold the slot
      env:
        SECONDS_TO_WAIT: ${{ inputs.seconds }}
      run: 'date -u

        sleep "$SECONDS_TO_WAIT"

        date -u'
