name: rust
permissions:
  contents: read
jobs:
  macos:
    runs-on: ubuntu-slim
    steps:
    - name: Dry-run suite
      run: echo "Dry-run suite selected"
    name: Test on Mac
    if: ${{ !inputs.lint-only }}
  windows:
    runs-on: ubuntu-slim
    steps:
    - name: Dry-run suite
      run: echo "Dry-run suite selected"
    name: Test on Windows
    if: ${{ !inputs.lint-only }}
  lint:
    runs-on: ubuntu-slim
    steps:
    - name: Dry-run suite
      run: echo "Dry-run suite selected"
    - name: Controlled failure on first attempt
      env:
        OUTCOME: ${{ github.event.inputs.outcome }}
        ATTEMPT: ${{ github.run_attempt }}
      run: if [ "$OUTCOME" = failure ] && [ "$ATTEMPT" = 1 ]; then exit 1; fi
    name: Lint (cargo fmt)
  unused-dependencies:
    runs-on: ubuntu-slim
    steps:
    - name: Dry-run suite
      run: echo "Dry-run suite selected"
    name: Check unused dependencies
  msrv:
    runs-on: ubuntu-slim
    steps:
    - name: Dry-run suite
      run: echo "Dry-run suite selected"
    name: Verify MSRV (Minimum Supported Rust Version)
    if: ${{ !inputs.lint-only }}
'on':
  workflow_call:
    inputs:
      lint-only:
        description: Run only formatting and unused dependency checks
        type: boolean
        default: false
