name: integration
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-slim
    steps:
    - name: Dry-run suite
      run: echo "Dry-run suite selected"
    name: Archery test With other arrows
    if: ${{ !inputs.cache-refresh-only }}
'on':
  workflow_call:
    inputs:
      cache-refresh-only:
        description: Populate caches without running tests or linters
        type: boolean
        default: false
