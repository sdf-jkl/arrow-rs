# Adapted from apache/datafusion#26683 (also SPARK-60440).
# Signal dev_pr.yml and fork_ci_status.yml without running PR code with a
# write token. The consumers use workflow_run: requested to avoid waiting
# for CI or approval of this unprivileged run.
name: Pull request signal
# Preserve the opening event for dev_pr.yml's one-time issue-label copy.
run-name: PR ${{ github.event.pull_request.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  signal:
    name: Signal pull request update
    runs-on: ubuntu-slim
    steps:
      - run: echo "This run triggers the workflow_run workflows that handle the pull request."
